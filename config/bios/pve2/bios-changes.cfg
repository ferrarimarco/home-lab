# pve2 (Supermicro X10SRL-F, BIOS 3.4): BIOS changes for the 24/7 power
# reduction. Apply in-band with Supermicro Update Manager:
#   ./sum -c ChangeBiosCfg --file pve2-bios-changes.cfg
# The settings take effect at the next boot. Names and values come from the
# GetCurrentBiosCfg export of 2026-10-05.

[Advanced|sSATA Configuration]
# The three drives (HD103SJ, ST4000VN006, Vertex 3) are on sSATA ports 0-2.
# Hot-plug off lets the kernel apply link power management (it treats
# hot-plug-capable ports as external and refuses LPM on them); aggressive link
# power management enables the host-initiated side (SALP). Neither spins the
# drives down: they act on the SATA link, not on the spindle.
sSATA Support Aggressive Link Power Mgmt=01     // 00 (Disabled), 01 (Enabled)
sSATA Port 0 Hot Plug=00                        // 00 (Disabled), 01 (Enabled)
sSATA Port 1 Hot Plug=00                        // 00 (Disabled), 01 (Enabled)
sSATA Port 2 Hot Plug=00                        // 00 (Disabled), 01 (Enabled)

[Advanced|SATA Configuration]
# The six-port PCH controller has no drives; the boot disk is NVMe.
SATA Controller=00                              // 00 (Disabled), 01 (Enabled)

[Advanced|Chipset Configuration|South Bridge]
# No audio codec on this board.
Azalia=00                                       // 00 (Disabled), 01 (Enabled), 02 (Auto)

[Advanced|Super IO Configuration|Serial Port 1 Configuration]
# COM1 console redirection is off; serial port 2 stays for the BMC's
# serial-over-LAN console.
Serial Port 1=00                                // 00 (Disabled), 01 (Enabled)
