[defaults]
callbacks_enabled=ansible.posix.profile_roles,ansible.posix.profile_tasks,ansible.posix.timer
stdout_callback=ansible.posix.debug
stderr_callback=ansible.posix.debug

[diff]
context = 10

[ssh_connection]
pipelining=True
# The keepalives refresh the connection tracking between the Ansible container
# and the hosts while a long task idles the session (a 6 GB image pull left a
# run waiting forever on a dropped connection, hl01, 2026-10-21), and fail the
# task within 90 s when the connection is gone.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=3
