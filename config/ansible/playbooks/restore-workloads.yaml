---
# Restore a stack's state trees, or a list of paths, on a Debian host from a
# restic repository, through the restore mode of the restic job script, run by
# systemd-run with the job's environment (see the backup operations guide). Dry
# run by default: the run lists what a restore would write and changes
# nothing; pass restore_apply=true to restore for real, which stops the stack,
# restores both state trees in place, and starts the stack again (a paths
# restore stops nothing); in either mode the units named in
# restore_services_to_restart are restarted after a real restore.
#
# Variables (pass them with -e):
#   restore_hosts          the target host (required: the play refuses to run
#                          without it, so a restore never fans out to all hosts)
#   restore_stack          the state directory name, as in
#                          /etc/ferrarimarco-home-lab/<stack>
#   restore_paths          instead of restore_stack: the paths to restore in
#                          place (a JSON list), for state outside the stacks
#                          such as the host's SSH identity
#   restore_services_to_restart  systemd units to restart after a real
#                          restore (a JSON list, default none), such as ssh
#                          after the host keys
#   restore_compose_stack  the Compose project that runs it, when it differs
#                          (qbittorrent's state is run by media-stack)
#   restore_compose_service  the Compose service to stop and start (default:
#                          restore_stack); the rest of the project keeps running
#   restore_snapshot     a snapshot id or "latest" (default)
#   restore_source_host  the inventory host whose repository to restore from
#                        (default: the target host itself)
#   restore_apply        true to restore for real (default: false)
#
# Example, a dry run of restoring qBittorrent on hl01 from its own repository:
#   ADDITIONAL_ANSIBLE_FLAGS="-e restore_hosts=hl01.edge.lab.ferrari.how -e restore_stack=qbittorrent -e restore_compose_stack=media-stack -e restore_compose_service=qbittorrent-nox" \
#     ANSIBLE_PLAYBOOK_FILE_NAME="restore-workloads.yaml" scripts/run-ansible.sh
# Example, a dry run of restoring a re-imaged host's SSH identity (the backup
# operations guide has the full path list):
#   ADDITIONAL_ANSIBLE_FLAGS="-e restore_hosts=raspberrypi2.edge.lab.ferrari.how -e '{\"restore_paths\": [\"/etc/ssh/ssh_host_ed25519_key\", \"/home/pi/.ssh\"], \"restore_services_to_restart\": [\"ssh\"]}'" \
#     ANSIBLE_PLAYBOOK_FILE_NAME="restore-workloads.yaml" scripts/run-ansible.sh
- name: Restore a stack's state or a list of paths from a restic repository
  hosts: "{{ restore_hosts }}"
  gather_facts: false
  vars:
    restore_snapshot: latest
    restore_apply: false
    restore_source_host: "{{ inventory_hostname }}"
    restore_job_name: restic-backup-workloads
    # A stack restore stops and starts the service that owns the state; a
    # paths restore manages no service
    restore_manage_service: "{{ restore_paths is not defined }}"
    restore_services_to_restart: []
    restore_compose_stack: "{{ restore_stack | default('') }}"
    restore_compose_service: "{{ restore_stack | default('') }}"
    restore_configuration_directory_path: "{{ home_lab_configuration_directory_path }}/restic"
    restore_script_path: "{{ restore_configuration_directory_path }}/entrypoint.sh"
    restore_job_environment_file_path: "{{ restore_configuration_directory_path }}/{{ restore_job_name }}.env"
    # The environment of a restore from another host's repository, written for
    # the run and removed afterwards
    restore_source_environment_file_path: "/run/{{ restore_job_name }}-restore.env"
    restore_log_file_path: "/tmp/restic-restore-{{ restore_stack | default('paths') }}.log"
    # The jobs declared present on the target and on the source host, split as
    # the backup role splits them
    restore_target_jobs: "{{ restic_backup_jobs | default([]) }}"
    restore_source_jobs: "{{ hostvars[restore_source_host].restic_backup_jobs | default([]) }}"
    restore_target_present_jobs: >-
      {{ (restore_target_jobs | rejectattr('state', 'defined') | list
      + restore_target_jobs | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list)
      | map(attribute='job_name') | list }}
    restore_source_present_jobs: >-
      {{ (restore_source_jobs | rejectattr('state', 'defined') | list
      + restore_source_jobs | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list)
      | map(attribute='job_name') | list }}
  tasks:
    - name: Check the restore variables
      ansible.builtin.assert:
        that:
          - (restore_paths is defined and restore_paths is not string and restore_paths | length > 0) or (restore_stack is defined and restore_stack | length > 0)
          - restore_source_host in hostvars
          - restore_job_name in restore_target_present_jobs
          - restore_job_name in restore_source_present_jobs
        fail_msg: >-
          Pass restore_hosts (a host that declares the {{ restore_job_name }}
          restic job as present), restore_stack (the state directory name) or
          restore_paths (a list of paths to restore in place) and, optionally,
          restore_snapshot, restore_source_host (an inventory host that
          declares the same job), restore_compose_stack,
          restore_compose_service, restore_services_to_restart, and
          restore_apply=true.

    - name: Compute the restore paths
      ansible.builtin.set_fact:
        restore_stack_compose_file_path: "{{ home_lab_configuration_directory_path }}/{{ restore_compose_stack }}/compose.yaml"
        restore_state_trees: >-
          {{ restore_paths if restore_paths is defined else
          [home_lab_configuration_directory_path ~ '/' ~ restore_stack,
          home_lab_runtime_directory_path ~ '/' ~ restore_stack] }}
        restore_source_job: "{{ hostvars[restore_source_host].restic_backup_jobs | selectattr('job_name', 'equalto', restore_job_name) | first }}"
        restore_cross_host: "{{ restore_source_host != inventory_hostname }}"
      # The job entry carries the repository password
      no_log: true

    - name: Print the restore plan
      ansible.builtin.debug:
        msg: >-
          {{ (restore_apply | bool) | ternary('RESTORING', 'Dry run of restoring') }}
          {{ restore_state_trees | join(' and ') }} from snapshot {{ restore_snapshot }}
          of {{ restore_source_host }}'s repository ({{ restore_source_job.restic_repository_host_path }}),
          through {{ restore_script_path }} on {{ inventory_hostname }}.

    # The run reads the environment through systemd, as the job units do, so
    # one parser interprets the password; --wait --pipe return the script's
    # output and exit status. The textfile directory is unset so that a
    # restore writes no job metrics: a foreign repository identity reported
    # here would fire ResticRepositoryChanged.
    - name: Build the restore command
      ansible.builtin.set_fact:
        restore_command: >-
          systemd-run --wait --pipe --collect --quiet
          --property EnvironmentFile={{ restore_cross_host | bool | ternary(restore_source_environment_file_path, restore_job_environment_file_path) }}
          --property CacheDirectory=restic
          --property UnsetEnvironment=RESTIC_TEXTFILE_COLLECTOR_DIRECTORY
          --setenv RESTIC_RESTORE_SNAPSHOT={{ restore_snapshot | quote }}
          --setenv RESTIC_RESTORE_TARGET=/
          --setenv RESTIC_RESTORE_ALLOW_EMPTY=true
          --setenv RESTIC_RESTORE_DRY_RUN={{ (not (restore_apply | bool)) | string | lower }}

    - name: Check that the Compose project exists
      ansible.builtin.stat:
        path: "{{ restore_stack_compose_file_path }}"
      become: true
      register: restore_compose_file
      failed_when: not restore_compose_file.stat.exists
      when: restore_apply | bool and restore_manage_service | bool

    - name: Start a fresh restore log
      ansible.builtin.copy:
        content: ""
        dest: "{{ restore_log_file_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      changed_when: false
      tags:
        - molecule-notest

    # Another host's repository is reached through an environment file of its
    # own, with that host's repository and password from the shared vault,
    # instead of the local job's file: systemd applies EnvironmentFile= after
    # Environment=, so a --setenv override of the password would lose. The
    # file is single-quoted, as the role renders the job files, and the role
    # asserts that the passwords hold no quote or newline. The script reads the
    # job name from RESTIC_BACKUP_TAGS before it enters the restore mode.
    - name: Write the environment of the source host's repository
      ansible.builtin.copy:
        content: |
          RESTIC_BACKUP_TAGS='{{ restore_job_name }}'
          RESTIC_CACHE_DIR='/var/cache/restic'
          RESTIC_PASSWORD='{{ restore_source_job.restic_repository_password }}'
          RESTIC_REPOSITORY='{{ restore_source_job.restic_repository_host_path }}'
        dest: "{{ restore_source_environment_file_path }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      changed_when: false
      no_log: true
      when: restore_cross_host | bool
      tags:
        - molecule-notest

    - name: Restore with the service stopped
      block:
        - name: Stop the service before restoring its state
          ansible.builtin.command: docker compose --file {{ restore_stack_compose_file_path }} stop {{ restore_compose_service }}
          become: true
          changed_when: true
          when: restore_apply | bool and restore_manage_service | bool
          tags:
            - molecule-notest

        # One transient unit per state tree, named after the job, so that a
        # run never collides with the job's own units
        - name: Restore the state trees
          ansible.builtin.shell: >-
            {{ restore_command }}
            --unit {{ restore_job_name }}-restore-{{ restore_tree_index }}
            --setenv RESTIC_RESTORE_INCLUDE={{ item | quote }}
            {{ restore_script_path }}
            >> "{{ restore_log_file_path }}" 2>&1
          become: true
          changed_when: restore_apply | bool
          loop: "{{ restore_state_trees }}"
          loop_control:
            index_var: restore_tree_index
            label: "{{ item }}"
          register: restore_runs
          tags:
            - molecule-notest

      rescue:
        - name: Remember that the restore failed
          ansible.builtin.set_fact:
            restore_failed: true
      # Whatever the restore did, its log is shown and the service it stopped
      # comes back; the failure is raised again afterwards
      always:
        - name: Read the restore log
          ansible.builtin.command: cat {{ restore_log_file_path }}
          become: true
          changed_when: false
          register: restore_log
          tags:
            - molecule-notest

        - name: Print the restore log
          ansible.builtin.debug:
            var: restore_log.stdout_lines

        - name: Remove the environment of the source host's repository
          ansible.builtin.file:
            path: "{{ restore_source_environment_file_path }}"
            state: absent
          become: true
          changed_when: false
          when: restore_cross_host | bool

        - name: Start the service again
          ansible.builtin.command: docker compose --file {{ restore_stack_compose_file_path }} up --detach {{ restore_compose_service }}
          become: true
          changed_when: true
          when: restore_apply | bool and restore_manage_service | bool
          tags:
            - molecule-notest

        # The units that read the restored paths (sshd after the host keys);
        # a restart of ssh keeps the established sessions
        - name: Restart the services that read the restored paths
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: restarted
          become: true
          loop: "{{ restore_services_to_restart }}"
          when: restore_apply | bool and not (restore_failed | default(false))
          tags:
            - molecule-notest

        - name: Fail the play when the restore failed
          ansible.builtin.fail:
            msg: >-
              The restore failed; see the restore log above.
              {{ restore_manage_service | bool | ternary('The service was started again.', 'No service was restarted.') }}
          when: restore_failed | default(false)

    - name: Print the verification steps
      ansible.builtin.debug:
        msg: >-
          {% if restore_manage_service | bool %}Verify {{ restore_stack }} through
          its own interface, then compare{% else %}Compare{% endif %} the
          restored paths with the snapshot listing: on the host, as root,
          sh -c 'set -a; . {{ restore_job_environment_file_path }}; exec restic ls
          {{ restore_snapshot }} {{ restore_state_trees | join(' ') }}'.
      when: restore_apply | bool
