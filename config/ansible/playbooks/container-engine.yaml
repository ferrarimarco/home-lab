---
- name: Import the bootstrap playbook
  ansible.builtin.import_playbook: bootstrap.yaml

- name: Configure container engine
  hosts: all
  gather_facts: true
  roles:
    - role: geerlingguy.docker
      become: true
      # Hosts opt into the container engine with configure_docker:
      # Proxmox nodes and NixOS hosts must not get Docker installed.
      when: configure_docker | default(false)
