---
# This file is here, and not with the other linters' configuration, because
# ansible-lint takes its directory as the project: from here it finds the
# roles and installs the pinned role and collections of requirements.yml
# (into the ANSIBLE_HOME of the linters' environment file, outside the
# repository, where the other linters do not read them).
# The restore playbook takes its hosts from an extra variable with no default
extra_vars:
  restore_hosts: all
skip_list:
  - yaml # Don't run yamllint because we run it outside ansible-lint
  # The roles prefix their variables with the name of the role without its
  # ferrarimarco_home_lab_ part, and the inventory uses those names
  - var-naming[no-role-prefix]
use_default_rules: true
verbosity: 1
