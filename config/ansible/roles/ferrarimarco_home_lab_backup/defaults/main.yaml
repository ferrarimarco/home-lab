---
# Hosts opt in by declaring jobs; a host with no job converges the role's
# resources to absent, except the repositories, which stay in place.
# One entry per restic job the host runs, with:
#   job_name: the systemd units, snapshot tag, and metrics name of the job
#   directories_to_backup: the host paths the job backs up
#   restic_repository_host_path: the repository, never on the root filesystem
#   restic_repository_password: the repository password (a vault variable,
#     without single quotes or newlines)
#   restic_restore_drill_include: a secret-free file of the backup set that
#     the monthly drill restores into the scratch directory
#   restic_prometheus_exporter_port: the port of the job's exporter, unique on
#     the host, which the monitoring backends scrape
# and, optionally:
#   state: absent removes the job's units, exporter, and environment file,
#     and keeps the repository (present by default)
#   restic_exporter_enabled: false renders no exporter and no scrape target
#     (true by default)
#   restic_repository_owner: the owner of the repository and drill
#     directories, for a filesystem that presents one user (a CIFS mount's
#     uid option), root by default
#   restic_repository_mount_path: the mount point systemd manages under the
#     repository, when there is one: the exporter is also wanted by its mount
#     unit, so it starts again whenever the share is mounted
#   restic_restore_drill_host_path (next to the repository by default),
#   job_schedule, restic_restore_drill_schedule, restic_forget_policy,
#   restic_check_read_data_cycle_days, and restic_exporter_refresh_interval,
#   which fall back to the values below.
restic_backup_jobs: []
restic_backup_schedule: "02:00:00"
# Nights over which the job reads every pack file of the repository once
restic_check_read_data_cycle_days: 7
restic_configuration_directory_path: "{{ home_lab_configuration_directory_path | default('/etc/ferrarimarco-home-lab') }}/restic"
# Seconds between two collections of the exporter, each with its own
# structural check of the repository
restic_exporter_refresh_interval: 43200
restic_forget_policy:
  # Keep daily snapshots for the last week
  - --keep-within-daily 7d
restic_restore_drill_schedule: "Sun *-*-1..7 03:00:00"
# Where the job writes its metrics: the textfile collector directory of the
# Debian prometheus-node-exporter package. A host running a containerized node
# exporter declares its directory instead.
restic_textfile_collector_directory: /var/lib/prometheus/node-exporter
