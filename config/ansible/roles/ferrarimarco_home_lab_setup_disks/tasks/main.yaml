---
- name: Install packages required for mounts
  ansible.builtin.apt:
    name: "{{ mount_os_packages }}"
    state: present
  become: true
  when: mount_os_packages | default([]) | length > 0

# Credential files that mounts below reference (e.g. CIFS credentials=...).
# Written here, and not by the node role, because the disk setup playbook
# runs before the node playbook.
- name: Create mount credential files
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0600') }}"
    owner: "{{ item.owner | default('root') }}"
  become: true
  no_log: true
  with_items: "{{ mount_credential_files | default([]) }}"

- name: Create directories
  ansible.builtin.file:
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('root') }}"
    path: "{{ item.path }}"
    state: directory
  become: true
  with_items: "{{ directories_to_create | default([]) }}"

# An entry with protect_mount_point: true gets an immutable mount point
# (chattr +i), so that while its mount is absent nothing can create entries in
# the bare directory. This task does not set it through the module's
# `attributes` parameter: on a mounted path the module would act on the mounted
# filesystem's root instead of the directory under it, and with the additive
# form (`+i`) it compares the existing flag string (`ie` on ext4, the extents
# flag included) with `i` and reports a change on every run
# (ansible/ansible#41737, observed on raspberrypi2, 2026-10-19). The tasks in
# protect-mount-points.yaml converge the attribute instead.
- name: Create mountpoints
  ansible.builtin.file:
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('root') }}"
    path: "{{ item.path }}"
    state: directory
  become: true
  with_items: "{{ disks_to_mount | default([]) }}"

- name: Create partitions
  become: true
  community.general.parted:
    device: "{{ item.device }}"
    fs_type: "{{ item.fs_type | default('ext4') }}"
    number: "{{ item.partition_number }}"
    resize: "{{ item.resize | default(true) }}"
    state: present
  with_items: "{{ partitions_to_create | default([]) }}"

- name: Create filesystems
  become: true
  community.general.filesystem:
    fstype: "{{ item.fstype }}"
    dev: "{{ item.dev }}"
    resizefs: "{{ item.resizefs | default(omit) }}"
  with_items: "{{ filesystems_to_create | default([]) }}"

# Every mount except the root filesystem gets nofail, so a dead or absent
# device degrades to a missing mount instead of stalling the boot in the
# emergency shell (raspberrypi2, 2026-10-09). An entry that must block the boot
# sets block_boot: true.
- name: Mount devices
  become: true
  ansible.posix.mount:
    fstype: "{{ item.fstype }}"
    opts: >-
      {{ item.opts | default('defaults')
      if (item.path == '/' or item.block_boot | default(false)
      or 'nofail' in (item.opts | default('defaults')).split(','))
      else (item.opts | default('defaults')) ~ ',nofail' }}
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    state: "{{ item.state }}"
  register: setup_disks_mount_devices
  with_items: "{{ disks_to_mount | default([]) }}"

# The mount module edits fstab and remounts, but systemd keeps the mount units
# it generated at boot until a reload, so an ordering option such as
# x-systemd.before only takes effect after it (raspberrypi2, 2026-10-19).
- name: Reload the systemd daemon after fstab changes
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  # The module reports no change for a reload; record it in the run log.
  changed_when: true
  when: setup_disks_mount_devices.changed

- name: Converge the immutable attribute of the protected mount points
  ansible.builtin.include_tasks:
    file: protect-mount-points.yaml
  # Only entries that declare protect_mount_point opt in, so hosts without the
  # key never run the namespace reads.
  when: disks_to_mount | default([]) | selectattr('protect_mount_point', 'defined') | list | length > 0

- name: Configure ZFS pools and datasets
  ansible.builtin.include_tasks:
    file: zfs.yaml
  # Skip entirely on hosts that declare no ZFS resources, so the zpool/zfs
  # state queries never run where the tools may not exist.
  when: (zfs_pools | default([]) | length > 0) or (zfs_datasets | default([]) | length > 0)
