---
- name: Install APT packages
  ansible.builtin.apt:
    cache_valid_time: "{{ apt_cache_valid_time }}"
    name: "{{ monitoring_os_packages }}"
    state: present
    update_cache: true
  become: true

# The packaged unit passes the ARGS of this file to the exporter, which leaves
# out the count of automatic restarts the restart-frequency alert reads
- name: Enable the restart metrics of the node exporter
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: "^ARGS="
    line: 'ARGS="--collector.systemd.enable-restarts-metrics"'
  become: true
  register: monitoring_node_exporter_arguments
  # In check mode on a host without the package, the file is one the install
  # task above only predicts: accept that failure as the prediction, and keep
  # every other one
  failed_when:
    - monitoring_node_exporter_arguments is failed
    - not (ansible_check_mode and 'does not exist' in monitoring_node_exporter_arguments.msg | default(''))
  notify: Restart the node exporter

- name: Declare the USB bridges smartmontools does not know
  ansible.builtin.template:
    src: smart_drivedb.h.jinja
    dest: "{{ monitoring_smartmontools_local_drive_database_path }}"
    owner: root
    group: root
    mode: "0644"
    # smartctl parses the file as the whole database and fails on a syntax
    # error, which it would otherwise report on every later run
    validate: smartctl --drivedb=%s --presets=showall
  become: true
  when: monitoring_smartmontools_usb_bridges | length > 0

- name: Remove the local drive database when no bridge is declared
  ansible.builtin.file:
    path: "{{ monitoring_smartmontools_local_drive_database_path }}"
    state: absent
  become: true
  when: monitoring_smartmontools_usb_bridges | length == 0

- name: Record successful APT updates for the apt collector
  ansible.builtin.copy:
    src: 99-monitoring-apt-update-success-stamp
    dest: /etc/apt/apt.conf.d/99-monitoring-apt-update-success-stamp
    owner: root
    group: root
    mode: "0644"
  become: true
