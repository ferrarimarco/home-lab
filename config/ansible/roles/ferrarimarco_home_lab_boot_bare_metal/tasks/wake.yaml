---
# Unlike the magic packets below, the BMC confirms the power state, so a
# failure here is a verdict: there is no best-effort handling
- name: Power on through the BMC
  community.general.ipmi_power:
    name: "{{ boot_bare_metal_bmc.address }}"
    user: "{{ boot_bare_metal_bmc.user }}"
    password: "{{ boot_bare_metal_bmc.password }}"
    state: "on"
  delegate_to: localhost
  when: boot_bare_metal_bmc is defined

- name: Send Wake-on-LAN magic packets
  community.general.wakeonlan:
    mac: "{{ item.mac_address }}"
  # Don't report changes because this task always reports a status
  # of 'changed', breaking idempotence tests
  changed_when: false
  delegate_to: "{{ boot_bare_metal_wake_on_lan_relay_host }}"
  # The send is best effort: with the relay down, a host that is up still
  # passes the wait below, and one that is off fails it
  ignore_unreachable: true
  with_items: "{{ network_interfaces }}"
  when:
    - network_interfaces is defined
    - item.mac_address is defined

- name: Wait for the machines to come online
  ansible.builtin.wait_for_connection:
    timeout: 600
