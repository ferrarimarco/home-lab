---
- name: Print information about the target host
  ansible.builtin.import_tasks: print-host-info.yaml
  tags:
    - always

- name: Validate the runtime environment before running the configuration process
  ansible.builtin.import_tasks: pre-flight-checks.yaml
  tags:
    - always

- name: Load a variable file based on the OS type, or a default if not found
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'] }}.yaml"
    - "{{ ansible_facts['distribution'] }}.yaml"
    - "{{ ansible_facts['os_family'] }}.yaml"
    - "default.yaml"
  tags:
    - always

- name: Load Proxmox-specific variable file
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "default-proxmox.yaml"
  when:
    - is_proxmox_node | default(false)
  tags:
    - always

- name: Setup Proxmox OS packages and repositories
  ansible.builtin.include_tasks:
    file: setup-Proxmox.yaml
  when:
    - is_proxmox_node | default(false)
  tags:
    - proxmox

- name: Setup OS
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  with_first_found:
    - "setup-{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'] }}.yaml"
    - "setup-{{ ansible_facts['distribution'] }}.yaml"
    - "setup-{{ ansible_facts['os_family'] }}.yaml"

- name: Configure Home Lab configuration directories
  ansible.builtin.file:
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('root') }}"
    path: "{{ item.path }}"
    state: directory
  become: true
  with_items:
    - path: "{{ home_lab_configuration_directory_path }}"
    - path: "{{ home_lab_runtime_directory_path }}"

- name: Setup ansible_user
  ansible.builtin.import_tasks: setup-ansible-user.yaml
  # The tag converges the user and its authorized keys without the OS tasks
  # (`--tags authorized-keys`); on Proxmox nodes add the `proxmox` tag too,
  # since those tasks register the node's own key in the exclusive set.
  tags:
    - authorized-keys

- name: Setup systemd
  ansible.builtin.import_tasks: setup-systemd.yaml
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Ensure handlers are notified now
  ansible.builtin.meta: flush_handlers

# Several playbooks import the bootstrap playbook so that each can run on its
# own, and a playbook that imports more than one of them would run the role
# once per import: the bootstrap play skips the role on a host that carries
# this fact. Last, so that a host the role failed on does not carry it, and
# always, so that a tag-scoped run records it too. The flush above has to stay
# right before it: the role's handlers inherit the play's condition on this
# fact, so a handler that ran after this task would be skipped.
- name: Record that the role ran on this host in this playbook run
  ansible.builtin.set_fact:
    bootstrap_completed: true
  tags:
    - always
