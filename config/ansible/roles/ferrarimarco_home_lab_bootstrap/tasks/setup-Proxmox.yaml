---
- name: Remove enterprise APT repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  with_items:
    - /etc/apt/sources.list.d/ceph.list
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/pve-enterprise.sources
  notify:
    - Update APT cache

- name: Enable PVE no-subscription repositories
  ansible.builtin.deb822_repository:
    # This module needs the python3-debian package. This is the first task
    # that uses the module on Proxmox nodes, and it runs before the role
    # installs OS packages, so let the module install the package if it's
    # missing, such as on minimal installations.
    install_python_debian: true
    name: "{{ item.name }}"
    uris: "{{ item.uris }}"
    suites: "{{ debian_release }}"
    components: "{{ item.components }}"
    signed_by: "https://enterprise.proxmox.com/debian/proxmox-release-{{ debian_release }}.gpg"
    types: deb
  become: true
  with_items:
    - name: pve-no-subscription
      uris: http://download.proxmox.com/debian/pve
      components: pve-no-subscription
    - name: ceph
      uris: http://download.proxmox.com/debian/ceph-squid
      components: no-subscription
  notify:
    - Update APT cache

- name: Ensure handlers are notified now
  ansible.builtin.meta: flush_handlers

# Proxmox appends the node's root SSH public key to the shared authorized_keys
# file on every pveproxy start (pvecm updatecerts). Declaring it as part of the
# exclusive key set keeps the file stable instead of flapping between runs and
# boots. The Proxmox installer generates the key, so test instances lack it.
- name: Check whether the Proxmox node root SSH public key exists
  ansible.builtin.stat:
    path: "{{ proxmox_node_root_ssh_public_key_path }}"
  register: proxmox_node_root_ssh_public_key_stat
  become: true

- name: Read the Proxmox node root SSH public key
  ansible.builtin.slurp:
    src: "{{ proxmox_node_root_ssh_public_key_path }}"
  register: proxmox_node_root_ssh_public_key
  become: true
  check_mode: false
  when: proxmox_node_root_ssh_public_key_stat.stat.exists

- name: Register the Proxmox node root SSH public key as an authorized key
  ansible.builtin.set_fact:
    bootstrap_additional_authorized_keys: >-
      {{ bootstrap_additional_authorized_keys | default([])
          + [proxmox_node_root_ssh_public_key.content | b64decode | trim] }}
  when: proxmox_node_root_ssh_public_key_stat.stat.exists
