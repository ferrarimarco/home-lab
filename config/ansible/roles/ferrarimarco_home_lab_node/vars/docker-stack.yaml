---
docker_compose_up_items: []
# The Compose items of the stacks a run disables (tasks/include-variables.yaml)
docker_compose_disabled_items: []
docker_compose_services_to_restart: []
# One unit per Compose project (tasks/setup-docker-compose-units.yaml),
# named <prefix>-<project>.service after the project's directory
docker_compose_up_unit_name_prefix: docker-compose-up
docker_system_prune_service_name: docker-system-prune
docker_system_prune_timer_file_name: "{{ docker_system_prune_service_name }}.timer"
docker_os_services:
  - enabled: true
    service_name: "{{ docker_system_prune_timer_file_name }}"
    service_state: "{{ configure_docker | ternary('started', 'stopped') }}"
# The service is timer-driven and carries no [Install] section, so it is not
# declared in docker_os_services: a unit without one reports "static", which
# the systemd module counts as enabled, and an enabled: false entry would try
# to disable it on every run. Neither unit lists a service to restart:
# restarting the service runs a prune, and so does restarting the timer on
# systemd 252 (hl01, 2026-10-12). The daemon reload that follows rendering
# re-reads both units and recomputes the timer's next elapse.
docker_templates_to_render:
  - src: "docker/system-prune-timer/{{ docker_system_prune_service_name }}.service.jinja"
    dest: "{{ systemd_system_services_configuration_directory }}/{{ docker_system_prune_service_name }}.service"
    state: "{{ configure_docker | ternary('file', 'absent') }}"
  - src: "docker/system-prune-timer/{{ docker_system_prune_timer_file_name }}.jinja"
    dest: "{{ systemd_system_services_configuration_directory }}/{{ docker_system_prune_timer_file_name }}"
    state: "{{ configure_docker | ternary('file', 'absent') }}"
