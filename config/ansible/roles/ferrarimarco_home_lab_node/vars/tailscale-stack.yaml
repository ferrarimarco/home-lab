---
tailscale_base_package_repository_url: "https://pkgs.tailscale.com/{{ tailscale_release_channel }}"
tailscale_os_package_repositories:
  - name: tailscale
    uris: "{{ tailscale_package_repository_url }}"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "{{ tailscale_package_repository_url }}/{{ ansible_distribution_release }}.gpg"
    state: "{{ configure_tailscale | ternary('present', 'absent') }}"
    # Files that the apt_key and apt_repository modules created before the
    # repository moved to a deb822 source (the .list name is derived from the
    # repository URL, as apt_repository does).
    legacy_file_paths:
      - "/etc/apt/sources.list.d/{{ tailscale_package_repository_url | regex_replace('^https?://', '') | regex_replace('[^a-zA-Z0-9]', '_') }}.list"
      - "{{ tailscale_package_repository_key_file_path }}"
tailscale_os_packages:
  - name: tailscale
    state: "{{ configure_tailscale | ternary('present', 'absent') }}"
tailscale_up_command: tailscale up --accept-routes
