---
- name: Debug debian_packages_to_uninstall
  ansible.builtin.debug:
    var: debian_packages_to_uninstall
    verbosity: 1

- name: Uninstall Debian packages
  ansible.builtin.apt:
    name: "{{ debian_packages_to_uninstall | default([]) }}"
    purge: true
    state: absent
    update_cache: true
  become: true
  when: ("uninstall-debian-packages" in ansible_run_tags or "all" in ansible_run_tags)

- name: Remove legacy APT repository files
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: absent
  become: true
  loop: "{{ apt_repositories | unique | subelements('legacy_file_paths', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"
  register: apt_legacy_repository_files

- name: Setup APT repositories
  ansible.builtin.deb822_repository:
    # The module needs python3-debian on the host, which minimal images and
    # fresh installations lack; the option installs it only when it is missing.
    install_python_debian: true
    name: "{{ item.name }}"
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components }}"
    signed_by: "{{ item.signed_by }}"
    types: deb
    state: "{{ item.state | default(omit) }}"
  become: true
  loop: "{{ apt_repositories | unique }}"
  loop_control:
    label: "{{ item.name }}"
  register: apt_deb822_repositories

- name: Update the APT cache after changing repositories
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: apt_legacy_repository_files is changed or apt_deb822_repositories is changed

- name: Debug debian_packages_to_install
  ansible.builtin.debug:
    var: debian_packages_to_install
    verbosity: 1

- name: Install Debian packages
  ansible.builtin.apt:
    cache_valid_time: "{{ apt_cache_valid_time }}"
    name: "{{ debian_packages_to_install | default([]) }}"
    state: present
    update_cache: true
  become: true
  when: ("install-debian-packages" in ansible_run_tags or "all" in ansible_run_tags)
