---
- name: Reload the systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Configure OS services
  ansible.builtin.systemd:
    name: "{{ item.service_name }}"
    state: "{{ item.service_state | default(omit) }}"
    enabled: "{{ item.enabled }}"
  with_items: "{{ os_services }}"
  register: stop_os_service
  # A disabled stack's unit may never have existed on this host: a stopped
  # state on a missing unit is converged. In check mode the package that ships
  # a unit was only predicted, so a missing unit is the prediction. A unit a
  # real run wants started and cannot find is a defect (a misspelled name, a
  # package that did not install).
  failed_when:
    - stop_os_service.failed == true
    - >-
      not ("Could not find the requested service" in stop_os_service.msg
      and (item.service_state | default('') == 'stopped' or ansible_check_mode))

- name: Reload the systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Debug stop_os_service
  ansible.builtin.debug:
    var: stop_os_service
    verbosity: 1
