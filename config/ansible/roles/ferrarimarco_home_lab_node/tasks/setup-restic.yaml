---
- name: Setup Restic services
  ansible.builtin.template:
    src: "{{ restic_templates_source_directory_path }}/restic-backup-timer/restic-backup.service.jinja"
    dest: "{{ systemd_system_services_configuration_directory }}/{{ item.job_name }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    restic_backup_job_name: "{{ item.job_name }}"
    restic_backup_job_repository_host_path: "{{ item.restic_repository_host_path }}"
    restic_backup_job_timer_definition: "{{ item.job_schedule }}"
  when:
    - configure_backup_restic
  with_items: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"

- name: Setup Restic timers
  ansible.builtin.template:
    src: "{{ restic_templates_source_directory_path }}/restic-backup-timer/restic-backup.timer.jinja"
    dest: "{{ systemd_system_services_configuration_directory }}/{{ item.job_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  vars:
    restic_backup_job_name: "{{ item.job_name }}"
    restic_backup_job_timer_definition: "{{ item.job_schedule }}"
  when:
    - configure_backup_restic
  with_items: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"

- name: Reload the systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Configure Restic services
  ansible.builtin.systemd:
    name: "{{ item.job_name }}.timer"
    state: "{{ configure_backup_restic | ternary('started', 'stopped') }}"
    enabled: "{{ configure_backup_restic | ternary(true, false) }}"
  with_items: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"
  register: stop_os_service
  # Services to stop might not exist, so we don't fail in that case
  failed_when:
    - stop_os_service.failed == true
    - '"Could not find the requested service" not in stop_os_service.msg'

- name: Delete Restic services
  ansible.builtin.file:
    path: "{{ systemd_system_services_configuration_directory }}/{{ item.job_name }}.service"
    state: absent
  when: not configure_backup_restic
  with_items: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"

- name: Delete Restic timers
  ansible.builtin.file:
    path: "{{ systemd_system_services_configuration_directory }}/{{ item.job_name }}.timer"
    state: absent
  when: not configure_backup_restic
  with_items: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"

- name: Delete unneeded Restic files and directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /host_path/restic/data

# Repositories are initialized once, by this task only (the entrypoint refuses
# an implicit init): read whether the repository exists and which filesystem
# backs its path, then act only on a missing repository whose path is not on
# the root filesystem, which is what the path becomes when its mount is gone.
- name: Check whether the Restic repositories are initialized
  ansible.builtin.stat:
    path: "{{ item.restic_repository_host_path }}/config"
  become: true
  check_mode: false
  register: restic_repository_config
  when:
    - configure_backup_restic
  with_items: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"

- name: Find the filesystem backing the Restic repositories
  ansible.builtin.command: findmnt --target {{ item.restic_repository_host_path }} -no TARGET
  become: true
  changed_when: false
  check_mode: false
  register: restic_repository_mount
  when:
    - configure_backup_restic
  with_items: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"

- name: Initialize missing Restic repositories
  ansible.builtin.command: >-
    docker compose --file {{ restic_docker_compose_destination_file_path }}
    --profile "{{ restic_backup_default_backup_job_docker_compose_profile }}"
    run --build --rm --env RESTIC_ALLOW_INIT=true --env RESTIC_ENABLE_BACKUP=false
    {{ item.job_name }}
  become: true
  loop: "{{ restic_default_backup_jobs + restic_backup_jobs | default([]) }}"
  loop_control:
    index_var: restic_job_index
  when:
    - configure_backup_restic
    - not restic_repository_config.results[restic_job_index].stat.exists
    - restic_repository_mount.results[restic_job_index].stdout != "/"
  tags:
    - molecule-notest
