---
- name: Get Raspberry Pi i2c status
  ansible.builtin.command: "raspi-config nonint get_i2c"
  become: true
  changed_when: false
  check_mode: false
  register: raspi_config_i2c_output

# The enable commands below are skipped in check mode, so the report tasks
# carry the prediction (raspi-config prints 0 for an enabled setting)
- name: Report the i2c setting to enable
  ansible.builtin.debug:
    msg: "i2c is disabled (raspi-config reports {{ raspi_config_i2c_output.stdout }}): enabling it"
  changed_when: raspi_config_i2c_output.stdout != "0"

- name: Enable i2c
  ansible.builtin.command: "raspi-config nonint do_i2c 0"
  become: true
  changed_when: true
  when: raspi_config_i2c_output.stdout != "0"

# The case daemon talks to the case over the hardware serial port; the
# serial console is a separate setting since Raspberry Pi OS Trixie split it.
- name: Get Raspberry Pi serial port status
  ansible.builtin.command: "raspi-config nonint get_serial_hw"
  become: true
  changed_when: false
  check_mode: false
  register: raspi_config_serial_output

- name: Report the serial port setting to enable
  ansible.builtin.debug:
    msg: "The serial port is disabled (raspi-config reports {{ raspi_config_serial_output.stdout }}): enabling it"
  changed_when: raspi_config_serial_output.stdout != "0"

- name: Enable the serial port
  ansible.builtin.command: "raspi-config nonint do_serial_hw 0"
  become: true
  changed_when: true
  when: raspi_config_serial_output.stdout != "0"
