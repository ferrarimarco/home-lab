---
# sshd keeps the established sessions through a restart, so a policy that
# rejects the user the run authenticates as surfaces only at the next login:
# fail the host before writing it instead.
- name: Assert that the SSH policy admits the user the run authenticates as
  ansible.builtin.assert:
    that:
      - security_ssh_permit_root_login != 'no' or ansible_user != 'root'
      - security_ssh_allowed_users | length == 0 or ansible_user in security_ssh_allowed_users
    fail_msg: >-
      The SSH policy would reject the next login of {{ ansible_user }}: set
      security_ssh_permit_root_login (prohibit-password keeps a key-only root
      login) or security_ssh_allowed_users in the host's or group's variables.
      When security_ssh_allowed_groups is set, confirm the user's membership
      by hand: the run does not read it.
    quiet: true

# The validation loads the candidate file as sshd would at start, its Include
# directive resolved against the real drop-in directory, so a value sshd
# rejects fails the task before the file is written and the restart notified.
- name: Configure SSH server
  ansible.builtin.lineinfile:
    dest: "{{ security_ssh_config_path }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    mode: "0644"
    validate: "{{ sshd_path }} -t -f %s"
  notify: Restart ssh
  with_items:
    - regexp: "^PermitRootLogin"
      line: "PermitRootLogin {{ security_ssh_permit_root_login }}"
    - regexp: "^Port"
      line: "Port {{ security_ssh_port }}"
    - regexp: "^UseDNS"
      line: "UseDNS {{ security_ssh_usedns }}"
    - regexp: "^PermitEmptyPasswords"
      line: "PermitEmptyPasswords {{ security_ssh_permit_empty_password }}"
    - regexp: "^ChallengeResponseAuthentication"
      line: "ChallengeResponseAuthentication {{ security_ssh_challenge_response_auth }}"
    - regexp: "^GSSAPIAuthentication"
      line: "GSSAPIAuthentication {{ security_ssh_gss_api_authentication }}"
    - regexp: "^X11Forwarding"
      line: "X11Forwarding {{ security_ssh_x11_forwarding }}"

# Do this in a dedicated task so that we're not locked out from SSH if we authenticated
# with a password.
- name: Configure SSH password-based authentication
  ansible.builtin.lineinfile:
    dest: "{{ security_ssh_config_path }}"
    regexp: "^PasswordAuthentication"
    line: "PasswordAuthentication {{ security_ssh_password_authentication }}"
    state: present
    mode: "0644"
    validate: "{{ sshd_path }} -t -f %s"
  notify: Restart ssh
  when: ansible_password is not defined

- name: Add configured users allowed to connect over ssh
  ansible.builtin.lineinfile:
    dest: "{{ security_ssh_config_path }}"
    regexp: "^AllowUsers"
    line: "AllowUsers {{ security_ssh_allowed_users | join(' ') }}"
    state: present
    create: true
    mode: "0644"
    validate: "{{ sshd_path }} -t -f %s"
  notify: Restart ssh
  when: security_ssh_allowed_users | length > 0

- name: Add configured groups allowed to connect over ssh
  ansible.builtin.lineinfile:
    dest: "{{ security_ssh_config_path }}"
    regexp: "^AllowGroups"
    line: "AllowGroups {{ security_ssh_allowed_groups | join(' ') }}"
    state: present
    create: true
    mode: "0644"
    validate: "{{ sshd_path }} -t -f %s"
  notify: Restart ssh
  when: security_ssh_allowed_groups | length > 0
