---
groups:
  - name: availability
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.instance }} is down"
          description: >-
            The {{ $labels.job }} target {{ $labels.instance }} has not
            answered scrapes for 10 minutes. The host may be down, or the
            exporter may have stopped.

  - name: node-health
    rules:
      - alert: UnexpectedReboot
        expr: changes(node_boot_time_seconds[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.instance }} rebooted"
          description: >-
            The boot time of {{ $labels.instance }} changed within the last
            hour. If this reboot was not planned, investigate: it may be a
            hardware watchdog recovery.
      - alert: NodeTextfileStale
        expr: time() - node_textfile_mtime_seconds > 26 * 3600
        labels:
          severity: warning
        annotations:
          summary: "Stale textfile {{ $labels.file }} on {{ $labels.instance }}"
          description: >-
            The node exporter textfile {{ $labels.file }} on
            {{ $labels.instance }} has not been updated for more than 26
            hours. The producing timer or service has probably stopped
            working.
      - alert: NodeFilesystemSpaceLow
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} < 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is low on space"
          description: >-
            The filesystem mounted at {{ $labels.mountpoint }} on
            {{ $labels.instance }} has had less than 15 percent of its
            space available for 30 minutes. Investigate what is consuming
            the disk before services start failing.
      - alert: NodeFilesystemSpaceCritical
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} < 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is almost full"
          description: >-
            The filesystem mounted at {{ $labels.mountpoint }} on
            {{ $labels.instance }} has had less than 5 percent of its
            space available for 10 minutes. Services writing to it are
            about to fail.
      - alert: NodeFilesystemInodesLow
        expr: >-
          node_filesystem_files_free{fstype!~"tmpfs|ramfs"}
          / node_filesystem_files{fstype!~"tmpfs|ramfs"} < 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is low on inodes"
          description: >-
            The filesystem mounted at {{ $labels.mountpoint }} on
            {{ $labels.instance }} has had less than 10 percent of its
            inodes available for 30 minutes. Writes start failing when
            inodes run out, even with free space left.
      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Unit {{ $labels.name }} failed on {{ $labels.instance }}"
          description: >-
            The systemd unit {{ $labels.name }} on {{ $labels.instance }}
            has been in the failed state for 15 minutes. Check its journal
            on the host.
      - alert: NodeClockSkewed
        expr: abs(node_timex_offset_seconds) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Clock on {{ $labels.instance }} is skewed"
          description: >-
            The clock on {{ $labels.instance }} has been more than 50
            milliseconds away from its time source for 15 minutes. Time
            synchronization has probably stopped working, which breaks
            TLS validation and metric ordering.
      - alert: EdacUncorrectableErrors
        expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Uncorrectable memory errors on {{ $labels.instance }}"
          description: >-
            The memory controller on {{ $labels.instance }} reported
            {{ $value }} uncorrectable errors in the last hour. A memory
            module is failing; data corruption is possible.

  - name: temperature
    rules:
      - alert: HostHighCpuTemperature
        expr: node_hwmon_temp_celsius > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High temperature on {{ $labels.instance }}"
          description: >-
            Sensor {{ $labels.chip }}/{{ $labels.sensor }} on
            {{ $labels.instance }} reports {{ $value }} degrees Celsius,
            above the 85 degrees Celsius threshold, for 5 minutes.
      - alert: CoralTpuHighTemperature
        expr: coral_pci_temperature_celsius > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Coral TPU is overheating on {{ $labels.instance }}"
          description: >-
            The Coral PCI module on {{ $labels.instance }} reports
            {{ $value }} degrees Celsius, above the 90 degrees Celsius
            threshold, for 5 minutes.
      - alert: CoralTpuSensorFailure
        expr: coral_pci_temperature_celsius < 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Coral TPU temperature sensor failure on {{ $labels.instance }}"
          description: >-
            The Coral PCI module temperature on {{ $labels.instance }} reads
            {{ $value }}: the exporter reports -1 when the sysfs read fails,
            and a hung device reports implausible negative values.

  - name: backups
    rules:
      - alert: ResticBackupStale
        expr: time() - restic_backup_timestamp > 2 * 86400
        labels:
          severity: warning
        annotations:
          summary: "Restic backup on {{ $labels.instance }} is getting stale"
          description: >-
            The latest restic snapshot for {{ $labels.instance }}
            ({{ $labels.client_hostname }}) is older than 2 days.
      - alert: ResticBackupMissing
        expr: time() - restic_backup_timestamp > 4 * 86400
        labels:
          severity: critical
        annotations:
          summary: "Restic backup on {{ $labels.instance }} is missing"
          description: >-
            The latest restic snapshot for {{ $labels.instance }}
            ({{ $labels.client_hostname }}) is older than 4 days: this is a
            standing data-loss exposure.
      - alert: ResticCheckFailed
        expr: restic_check_success == 0
        labels:
          severity: critical
        annotations:
          summary: "Restic repository check failed on {{ $labels.instance }}"
          description: >-
            The restic repository integrity check reported failure for
            {{ $labels.instance }}. Backups in this repository may not be
            restorable.

  - name: frigate
    rules:
      - alert: FrigateCameraStreamDown
        expr: frigate_camera_fps == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Frigate camera {{ $labels.camera_name }} produces no frames"
          description: >-
            The capture pipeline for camera {{ $labels.camera_name }} on
            {{ $labels.instance }} has produced no frames for 10 minutes.
            The camera may be offline, or the ffmpeg capture process is
            failing in a way the Frigate watchdog cannot recover.
      - alert: FrigateCameraCaptureRateAbnormal
        expr: frigate_skipped_fps > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Frigate skips frames for camera {{ $labels.camera_name }}"
          description: >-
            Frigate on {{ $labels.instance }} has been skipping more than 10
            frames per second from camera {{ $labels.camera_name }} for 15
            minutes. A healthy stream delivers at the configured detect rate
            with no skips: sustained skipping means the camera stream is
            delivering far more frames than configured, a known symptom of a
            corrupted stream that also crashes the hardware decoder.
      - alert: FrigateDetectorSlow
        expr: frigate_detector_inference_speed_seconds > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Frigate detector {{ $labels.name }} is slow"
          description: >-
            The {{ $labels.name }} object detector on {{ $labels.instance }}
            has averaged more than 100 milliseconds per inference for 10
            minutes. The Coral normally infers in well under 25
            milliseconds: sustained slowness means the detector is degraded
            or detection fell back to the CPU.

  - name: blackbox-probes
    rules:
      - alert: BlackboxProbeFailed
        expr: probe_success{job=~"blackbox-ping|blackbox-dns-.*"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Probe {{ $labels.job }} fails for {{ $labels.instance }}"
          description: >-
            The {{ $labels.job }} probe against {{ $labels.instance }} has
            been failing for 10 minutes: the host does not answer pings, or
            a DNS record does not resolve as declared.
      - alert: BlackboxHttpProbeFailed
        expr: probe_success{job="blackbox-http-2xx"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HTTP probe fails for {{ $labels.instance }}"
          description: >-
            The HTTP probe against {{ $labels.instance }} has been failing
            for 10 minutes: the endpoint is unreachable or does not answer
            with the expected status.

  - name: containers
    rules:
      - alert: ContainerRestartLooping
        expr: changes(container_start_time_seconds{name!=""}[30m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.instance }} is restart looping"
          description: >-
            The container {{ $labels.name }} on {{ $labels.instance }}
            restarted more than 3 times in the last 30 minutes. It is
            probably crash looping; check its logs.
      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{name!=""}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.instance }} was OOM killed"
          description: >-
            The kernel killed a process in the container
            {{ $labels.name }} on {{ $labels.instance }} for exceeding
            its memory limit within the last 30 minutes. Raise the limit
            or investigate the memory growth.

  - name: smart
    rules:
      - alert: SmartDeviceUnhealthy
        expr: smartmon_device_smart_healthy == 0
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.disk }} on {{ $labels.instance }} fails its SMART health check"
          description: >-
            The disk {{ $labels.disk }} on {{ $labels.instance }} fails
            the SMART overall health self-assessment. The drive considers
            itself failing: replace it, and verify the backups of the
            data it holds.
      - alert: SmartSectorsDegrading
        expr: >-
          delta(smartmon_current_pending_sector_raw_value[24h]) > 0
          or delta(smartmon_reallocated_sector_ct_raw_value[24h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.disk }} on {{ $labels.instance }} is accumulating bad sectors"
          description: >-
            The pending or reallocated sector count of the disk
            {{ $labels.disk }} on {{ $labels.instance }} grew within the
            last day. The drive surface is degrading: plan a replacement
            before it fails.

  - name: ups
    rules:
      - alert: UpsOnBattery
        expr: network_ups_tools_ups_status{flag="OB"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "UPS monitored by {{ $labels.instance }} is on battery"
          description: >-
            The UPS monitored by {{ $labels.instance }} has been running
            on battery for 2 minutes: mains power is out or browning out.
            Hosts shut down when the battery runs low.
      - alert: UpsLowBattery
        expr: network_ups_tools_ups_status{flag="LB"} == 1
        labels:
          severity: critical
        annotations:
          summary: "UPS monitored by {{ $labels.instance }} battery is low"
          description: >-
            The UPS monitored by {{ $labels.instance }} reports a low
            battery while on mains loss: connected hosts are about to
            shut down.

  - name: nixos-deployments
    rules:
      - alert: CominDeploymentFailed
        expr: >-
          comin_last_eval_failed == 1
          or comin_last_build_failed == 1
          or comin_last_deployment_failed == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "comin cannot deploy on {{ $labels.instance }}"
          description: >-
            The comin GitOps service on {{ $labels.instance }} has been
            failing to evaluate, build, or activate the latest commit
            for 30 minutes. The host keeps running its previous
            configuration: check the comin journal on the host.
      - alert: CominFetchFailed
        expr: comin_last_fetch_failed == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "comin cannot fetch on {{ $labels.instance }}"
          description: >-
            The comin GitOps service on {{ $labels.instance }} has been
            failing to fetch from {{ $labels.remote_name }} for 2 hours.
            The host silently stopped following the configuration
            repository.

  - name: monitoring-pipeline
    rules:
      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager {{ $labels.instance }} fails to deliver notifications"
          description: >-
            The Alertmanager instance {{ $labels.instance }} failed to
            deliver {{ $labels.integration }} notifications within the
            last 15 minutes. Alerts are not reaching the notification
            channel: the pipeline is failing silently.
      - alert: PrometheusNotificationsErroring
        expr: increase(prometheus_notifications_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Prometheus {{ $labels.instance }} cannot reach Alertmanager"
          description: >-
            The Prometheus replica {{ $labels.instance }} saw errors
            sending alerts to {{ $labels.alertmanager }} within the last
            15 minutes. If both replicas are affected, alerting is down.
      - alert: ConfigReloadFailed
        expr: >-
          prometheus_config_last_reload_successful == 0
          or alertmanager_config_last_reload_successful == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Configuration reload failed on {{ $labels.instance }}"
          description: >-
            The {{ $labels.job }} instance {{ $labels.instance }} failed
            to reload its configuration and keeps running the previous
            one. The deployed configuration on disk is broken.
      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Rule evaluation failures on {{ $labels.instance }}"
          description: >-
            The Prometheus replica {{ $labels.instance }} failed rule
            evaluations within the last 15 minutes. A broken rule
            silently stops the alerts it defines.
      - alert: AlertmanagerClusterDegraded
        expr: alertmanager_cluster_members < 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager cluster is degraded on {{ $labels.instance }}"
          description: >-
            The Alertmanager instance {{ $labels.instance }} has seen
            fewer than 2 cluster members for 15 minutes. The instances
            are not gossiping, so notification deduplication between the
            replicas is broken.

  - name: syncthing
    rules:
      - alert: SyncthingFolderError
        expr: syncthing_model_folder_state == 8
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Syncthing folder {{ $labels.folder }} on {{ $labels.instance }} is in error"
          description: >-
            The Syncthing folder {{ $labels.folder }} on
            {{ $labels.instance }} has been in the error state for 30
            minutes: the backup transport for that folder stopped operating.
            Check the folder's error message in the Syncthing GUI.
      - alert: SyncthingFolderOutOfSync
        expr: sum by (folder, instance) (syncthing_model_folder_summary{scope="need"}) > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Syncthing folder {{ $labels.folder }} on {{ $labels.instance }} is out of sync"
          description: >-
            The Syncthing folder {{ $labels.folder }} on
            {{ $labels.instance }} has had unmet sync needs for 24 hours.
            Steady-state transfers clear within hours, so the sync is
            probably stuck.
      - alert: SyncthingDeviceDisconnected
        expr: >-
          syncthing_connections_active == 0
          and on (device, instance)
          syncthing_config_device_info{name!="nas-pve1",paused="false"}
        for: 72h
        labels:
          severity: warning
        annotations:
          summary: "Syncthing peer {{ $labels.device }} unseen by {{ $labels.instance }}"
          description: >-
            The Syncthing device {{ $labels.device }} has not been connected
            to {{ $labels.instance }} for 3 days: offsite backups stopped
            flowing. Check the peer device and the tailnet connectivity.
