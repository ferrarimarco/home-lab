---
- name: Remove the retired Coral APT repository
  ansible.builtin.deb822_repository:
    name: coral-edgetpu-stable
    state: absent
  become: true
  register: coral_deb822_repository
  # On a host without python3-debian, check mode cannot predict the removal
  # (the node role installs the package in a real run): accept that one
  # failure as the prediction, and keep every other.
  failed_when:
    - coral_deb822_repository is failed
    - not (ansible_check_mode and 'python3-debian must be installed' in coral_deb822_repository.msg | default(''))

- name: Download the gasket DKMS package
  ansible.builtin.get_url:
    url: "{{ coral_gasket_dkms_package_url }}"
    dest: "{{ coral_gasket_dkms_package_destination_path }}"
    checksum: "{{ coral_gasket_dkms_package_checksum }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Check whether the gasket DKMS package file is on the host
  ansible.builtin.stat:
    path: "{{ coral_gasket_dkms_package_destination_path }}"
  register: coral_gasket_dkms_package_file
  check_mode: false

- name: Read the installed gasket DKMS package state
  # Prints "installed <version>" for an installed package; a removed package
  # that kept its configuration files prints "config-files <version>".
  ansible.builtin.command: dpkg-query --show --showformat '${db:Status-Status} ${Version}' gasket-dkms
  register: coral_gasket_dkms_installed_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the gasket DKMS package
  # The host only needs the kernel driver: Frigate's container ships its own
  # EdgeTPU runtime and the Coral exporter reads sysfs. The cache update lets
  # the dependencies (dkms, kernel headers) resolve after the dead source was
  # removed.
  ansible.builtin.apt:
    deb: "{{ coral_gasket_dkms_package_destination_path }}"
    update_cache: true
  become: true
  # In check mode the package file is only downloaded by a real run, so the
  # module cannot open it before the first run: the prediction task below
  # covers that case, and every other failure still fails the check.
  when: not ansible_check_mode or coral_gasket_dkms_package_file.stat.exists
  notify:
    - Reboot the host

- name: Predict the gasket DKMS package installation
  ansible.builtin.debug:
    msg: "A real run installs gasket-dkms {{ coral_gasket_dkms_package_version }} (current state: {{ coral_gasket_dkms_installed_state.stdout | default('not installed', true) }})"
  changed_when: coral_gasket_dkms_installed_state.stdout != 'installed ' ~ coral_gasket_dkms_package_version
  when: ansible_check_mode and not coral_gasket_dkms_package_file.stat.exists
  notify:
    - Reboot the host

- name: Remove the unused EdgeTPU runtime package
  ansible.builtin.apt:
    name: libedgetpu1-std
    state: absent
  become: true
