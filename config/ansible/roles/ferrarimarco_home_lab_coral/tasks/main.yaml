---
- name: Setup Coral OS packages
  ansible.builtin.include_tasks:
    file: setup-coral-os-packages.yaml
    # A dynamic include does not pass its tags to the included tasks
    apply:
      tags:
        - coral
  when:
    - has_coral_pci_accelerator
  # The tag scopes a run to this role: the playbooks that include it also
  # import the bootstrap playbook, whose untagged tasks stay out of a
  # `--tags coral` run.
  tags:
    - coral
