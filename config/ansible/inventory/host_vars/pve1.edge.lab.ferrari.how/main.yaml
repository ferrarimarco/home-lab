---
configure_monitoring_nut: true
# Persistent service state for the nas-pve1 LXC container (bind-mounted onto
# /var/lib/samba and /var/lib/syncthing); must exist before the container
# first starts. The Syncthing state is owned by UID 1000 because the service
# runs as that user (see the NAS LXC container spec, section 12.4).
directories_to_create:
  - path: /var/lib/samba-state/nas-pve1
  - path: /var/lib/syncthing-state/nas-pve1
    owner: "1000"
    group: "100"
    # Holds the Syncthing device private key; keep it owner-only, matching
    # the tmpfiles rule in the nas-pve1 NixOS configuration.
    mode: "0700"
  - path: /var/lib/tailscale-state/nas-pve1
    # Holds the Tailscale node private key; tailscaled runs as root, so the
    # directory stays root-owned and owner-only.
    mode: "0700"
monitoring_nut_devices:
  - id: eaton-ellipse-pro-1600-din-1
    description: Eaton Ellipse PRO 1600 DIN
    driver: usbhid-ups
    port: auto
    vendorId: "0463"
    productId: "FFFF"
    bus: "001"
network_interfaces:
  - mac_address: "7c:83:34:be:3f:23"
    interface_name: enp1s0
  - mac_address: "7c:83:34:be:3f:24"
    interface_name: enp2s0
    # Assigned using DHCP address reservation
    ipv4_address: "10.0.0.3"
# Datasets served by the nas-pve1 LXC container via bind mounts. Owned by
# UID 1000 (ferrarimarco) / GID 100 (users) to match the in-container user.
zfs_datasets:
  - name: rpool-sata/media
    mount_point: /rpool-sata/media
    owner: "1000"
    group: "100"
  - name: rpool-sata/backups
    mount_point: /rpool-sata/backups
    owner: "1000"
    group: "100"
  - name: rpool-usb-1/media
    mount_point: /rpool-usb-1/media
    owner: "1000"
    group: "100"
  - name: rpool-usb-1/backups
    mount_point: /rpool-usb-1/backups
    owner: "1000"
    group: "100"
  - name: rpool-usb-1/syncthing
    mount_point: /rpool-usb-1/syncthing
    owner: "1000"
    group: "100"
  # Replaceable media only (pool layout decided 2026-09-26): the library that
  # was lost with the raspberrypi2 data disk is rebuilt here.
  - name: rpool-usb-2/media
    mount_point: /rpool-usb-2/media
    owner: "1000"
    group: "100"
# Pools are asserted, not created; topology and options document the manual
# creation command (see the NAS LXC container spec, section 11.1).
zfs_pools:
  - name: rpool-sata
    create_options: "-o ashift=12"
    topology: /dev/disk/by-id/ata-TS128GSSD452K2_G699820214
  - name: rpool-usb-1
    create_options: "-o ashift=12"
    topology: /dev/disk/by-id/usb-TOSHIBA_External_USB_3.0_20150215010113F-0:0
  - name: rpool-usb-2
    create_options: "-o ashift=12"
    topology: /dev/disk/by-id/usb-LaCie_P9230_0000000035741a1320ed-0:0
