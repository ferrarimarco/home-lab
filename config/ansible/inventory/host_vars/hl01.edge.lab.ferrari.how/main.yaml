---
ansible_user: debian
configure_backup_restic: true
configure_docker: true
configure_frigate: true
configure_home_assistant: true
configure_media_stack: true
configure_monitoring_backend: true
configure_monitoring_nut_exporter: true
configure_monitoring_sata: false
configure_openssh_keypair: true
configure_rsync_daemon: true
has_coral_pci_accelerator: true
has_intel_igpu: true

network_interfaces:
  - mac_address: "bc:24:11:d4:f6:64"
    interface_name: eth0

# Backup
restic_backup_default_backup_job_repository_password: "{{ vault_workloads_backup_repository_password }}"

# Storage
# Backups and media live on the NAS LXC container's shares; the former local
# backup and data (media) virtual disks were deleted.
# x-systemd.before orders each mount attempt before Docker starts the
# containers that bind the share (nofail drops the ordering before
# remote-fs.target, so the unit must be named), and protect_mount_point keeps a
# container or a playbook run from writing into the bare mount point while the
# share is absent (hl01 reboot, 2026-10-18).
disks_to_mount:
  - fstype: cifs
    group: "{{ ansible_user }}"
    owner: "{{ ansible_user }}"
    opts: "credentials=/etc/smb-credentials-nas-pve1,uid=1000,gid=1000,vers=3.1.1,_netdev,nofail,x-systemd.before=docker.service"
    path: "{{ workloads_backup_disk_mount_path }}"
    protect_mount_point: true
    src: //nas-pve1.edge.lab.ferrari.how/backups
    state: mounted
  - fstype: cifs
    group: "{{ ansible_user }}"
    owner: "{{ ansible_user }}"
    opts: "credentials=/etc/smb-credentials-nas-pve1,uid=1000,gid=1000,vers=3.1.1,_netdev,nofail,x-systemd.before=docker.service"
    path: "{{ data_disk_mount_path }}"
    protect_mount_point: true
    src: //nas-pve1.edge.lab.ferrari.how/media-usb
    state: mounted
mount_credential_files:
  - path: /etc/smb-credentials-nas-pve1
    content: |
      username={{ vault_nas_smb_user }}
      password={{ vault_nas_smb_password }}
mount_os_packages:
  - cifs-utils

# Data synchronization
rsync_daemon_modules:
  - name: media
    path: "{{ media_directory_path }}"
    auth_users:
      - username: rsyncclient
        password: "{{ vault_media_rsyncclient_password }}"
    comment: media
    gid: "{{ ansible_user }}"
    uid: "{{ ansible_user }}"
    list: "yes"
    read_only: "no"
    secrets_file: /etc/rsyncd-media.secrets
    hosts_allow: "10.0.0.0/255.0.0.0"
