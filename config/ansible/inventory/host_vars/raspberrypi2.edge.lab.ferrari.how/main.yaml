---
# Backup: the workloads job comes from the home_lab_debian_workload_hosts
# group. The restic exporter release refuses the host's Python, so the
# exporter waits for the re-image (specs index, current focus); the job's
# textfile metrics still feed the coverage and freshness alerts.
restic_workloads_job_exporter_enabled: false
configure_asuswrt_chkwan: true
configure_monitoring_backend: true
configure_monitoring_ont: true
configure_openssh_keypair: true
configure_zigbee2mqtt: true
disks_to_mount:
  # The restic repository lives on the NAS LXC container's backups share, as
  # on hl01 (the NAS LXC container page describes the client side, including
  # the x-systemd.before ordering and protect_mount_point).
  - fstype: cifs
    group: "{{ ansible_user }}"
    owner: "{{ ansible_user }}"
    opts: "credentials=/etc/smb-credentials-nas-pve1,uid=1000,gid=1000,vers=3.1.1,_netdev,nofail,x-systemd.before=docker.service"
    path: "{{ workloads_backup_disk_mount_path }}"
    protect_mount_point: true
    src: //nas-pve1.edge.lab.ferrari.how/backups
    state: mounted
mount_credential_files:
  - path: /etc/smb-credentials-nas-pve1
    content: |
      username={{ vault_nas_smb_user }}
      password={{ vault_nas_smb_password }}
mount_os_packages:
  - cifs-utils
has_argonone_case: true
# The bootloader (EEPROM) configuration: the node role renders it and asserts
# that the live configuration matches (Network Boot Service specification).
# The network comes first in the boot order, so the rescue toggle on the boot
# server decides what the host boots, then the USB disk, then the SD card; the
# prefix makes the bootloader ask for its TFTP directory by host name instead
# of by serial number.
raspberry_pi_bootloader_configuration:
  BOOT_UART: "0"
  WAKE_ON_GPIO: "1"
  ENABLE_SELF_UPDATE: "1"
  BOOT_ORDER: "0xf142"
  TFTP_PREFIX: "1"
  TFTP_PREFIX_STR: "raspberrypi2/"
# The BCM2711 hardware watchdog supports timeouts up to about 15 seconds
systemd_runtime_watchdog_seconds: 15
tailscale_up_advertise_edge_environment_routes: true
zigbee_adapter_device_path: "/dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20220708144056-if00"

network_interfaces:
  - mac_address: "E4:5F:01:84:52:68"
    interface_name: eth0
    # Assigned using DHCP address reservation
    ipv4_address: "10.0.0.2"
