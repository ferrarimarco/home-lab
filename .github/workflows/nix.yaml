---
name: Build and check Nix config

on: # yamllint disable-line rule:truthy
  push:
    paths:
      - ".github/workflows/nix.yaml"
      - "config/nix/**"
  pull_request:
    paths:
      - ".github/workflows/nix.yaml"
      - "config/nix/**"
  workflow_call: null

permissions:
  contents: read

jobs:
  detect-tests:
    name: Dynamic test discovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config/nix
    outputs:
      hosts: ${{ steps.set-matrix.outputs.hosts }}
      machines: ${{ steps.set-matrix.outputs.machines }}
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Discover build matrices
        id: set-matrix
        run: |
          # Test hosts (VM/container integration tests): checks named host-<name>-test.
          # 1. Grab json containing all keys inside checks
          # 2. Extract keys starting with "host-" AND ending in "-test"
          # 3. Strip both prefixes and suffixes to yield the clean, raw hostname
          JSON_RAW=$(nix eval .#checks.x86_64-linux --json --apply 'builtins.attrNames')
          HOSTS_ARRAY=$(echo "$JSON_RAW" | jq -c '[.[] | select(startswith("host-") and endswith("-test")) | sub("^host-"; "") | sub("-test$"; "")]')

          # Machines: hosts whose production closure (system.build.toplevel) must
          # evaluate and build. Two markers qualify a host:
          # - a disko.nix: deployed via nixos-anywhere;
          # - comin enabled: GitOps-managed (e.g. LXC containers, which carry no
          #   disko.nix).
          # Fixture hosts match neither: their toplevel is not deployable (no
          # bootloader/disk config). What runs on real machines is the image
          # package built from the same modules (the installer ISO boots on
          # pristine VMs to install NixOS; the LXC tarball bootstraps
          # containers), which package-build-tests keeps buildable, while the
          # VM tests exercise the module sets. Building the production closure
          # is what surfaces evaluation-time failures (module assertions) that
          # the sandboxed VM tests mask by overriding parts of the
          # configuration (e.g. proxmoxLXC.manageHostName, comin remotes).
          DISKO_MACHINES=$(for d in hosts/*/; do
            [ -f "${d}default.nix" ] && [ -f "${d}disko.nix" ] && basename "$d"
          done || true)
          COMIN_MACHINES=$(nix eval .#nixosConfigurations --json \
            --apply 'cfgs: builtins.filter (name: (builtins.getAttr name cfgs).config.services.comin.enable) (builtins.attrNames cfgs)' \
            | jq -r '.[]')
          MACHINES_ARRAY=$(printf '%s\n%s\n' "$DISKO_MACHINES" "$COMIN_MACHINES" | sort -u | jq -Rnc '[inputs | select(length > 0)]')

          # Deployable images are exposed as flake packages (installer ISO, LXC tarball).
          PACKAGES_ARRAY=$(nix eval .#packages.x86_64-linux --json --apply 'builtins.attrNames')

          echo "Discovered host matrix targets: $HOSTS_ARRAY"
          echo "Discovered machine matrix targets: $MACHINES_ARRAY"
          echo "Discovered package matrix targets: $PACKAGES_ARRAY"
          {
            echo "hosts=$HOSTS_ARRAY"
            echo "machines=$MACHINES_ARRAY"
            echo "packages=$PACKAGES_ARRAY"
          } >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks and formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config/nix
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run linters and formatters
        run: nix build .#checks.x86_64-linux.lint-treefmt-nix --verbose

  functional-vm-tests:
    name: VM/container runtime test (${{ matrix.host }})
    needs:
      - detect-tests
      - static-checks
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-integration-${{ matrix.host }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: config/nix
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.detect-tests.outputs.hosts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix with KVM
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: true

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run Sandbox VM/container Test
        run: nix build ".#checks.x86_64-linux.host-${MATRIX_HOST}-test" --verbose
        env:
          MATRIX_HOST: ${{ matrix.host }}

  machine-build-tests:
    name: Build machine toplevel (${{ matrix.host }})
    needs:
      - detect-tests
      - static-checks
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-machine-${{ matrix.host }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: config/nix
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.detect-tests.outputs.machines) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Evaluate and Build Machine Toplevel
        run: nix build ".#nixosConfigurations.${MATRIX_HOST}.config.system.build.toplevel" --verbose
        env:
          MATRIX_HOST: ${{ matrix.host }}

  package-build-tests:
    name: Build image package (${{ matrix.package }})
    needs:
      - detect-tests
      - static-checks
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-package-${{ matrix.package }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: config/nix
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-tests.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Build Image Package
        run: nix build ".#packages.x86_64-linux.${MATRIX_PACKAGE}" --verbose
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
