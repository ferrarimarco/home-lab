---
updates:
  - package-ecosystem: "devcontainers"
    commit-message:
      prefix: "deps"
    directory: "/"
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "deps"
    directory: "/"
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    commit-message:
      prefix: "deps"
    directories:
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/monitoring-apt
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/monitoring-ont
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/sense-hat-exporter
      - /config/smart-desk/esphome
    groups:
      home-lab-workloads:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    commit-message:
      prefix: "deps"
    directories:
      - /config/pre-commit
      # /docker/ansible also covers the requirements file in its molecule
      # subdirectory: the branches of this directory's update job
      # (dependabot/pip/docker/ansible/...) change both files. Listing the
      # subdirectory as well registered the molecule requirements twice, and
      # the two jobs superseded each other's pull requests into duplicates
      # (observed on #2185/#2189 and #2192/#2193).
      - /docker/ansible
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    commit-message:
      prefix: "deps"
    directories:
      - /config/ansible/files/dependency-updates-helper
    groups:
      # The backup role pins the restic exporter's tarball by hash next to
      # this tag, so a bump of the stage needs a hand-made commit before CI
      # passes (see the dependency updates guide): its own pull request keeps
      # the workloads group's from staying red meanwhile.
      backup-exporter:
        patterns:
          - ngosang/restic-exporter
      home-lab-workloads:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    commit-message:
      prefix: "deps"
    directories:
      - /docker/ansible
      - /docker/arduino-cli
      - /docker/ci-cd-tools
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    commit-message:
      prefix: "deps"
    directories:
      - /docker/ci-cd-tools
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "terraform"
    commit-message:
      prefix: "deps"
    directories:
      - /config/terraform/**
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    # Built-in providers ship with the Terraform binary and no registry serves
    # them, so looking them up fails the update job. Remove this rule when
    # Dependabot skips them. See
    # https://github.com/dependabot/dependabot-core/issues/11130
    ignore:
      - dependency-name: "builtin/terraform"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "nix"
    commit-message:
      prefix: "deps"
    directories:
      - /config/nix
    # A dependency joins the first group it matches, so keep the specific
    # groups before the catch-all one.
    groups:
      dev-ci-tools:
        patterns:
          - treefmt-nix
      home-lab-platform:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
version: 2
