---
updates:
  - package-ecosystem: "devcontainers"
    commit-message:
      prefix: "deps"
    directory: "/"
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "deps"
    directory: "/"
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    commit-message:
      prefix: "deps"
    directories:
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/monitoring-apt
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/monitoring-ont
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/sense-hat-exporter
      - /config/smart-desk/esphome
    groups:
      home-lab-workloads:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    commit-message:
      prefix: "deps"
    directories:
      - /config/pre-commit
      - /docker/ansible
      - /docker/ansible/molecule
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    commit-message:
      prefix: "deps"
    directories:
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/dependency-updates-helper
      - /config/ansible/roles/ferrarimarco_home_lab_node/files/config/restic
    groups:
      home-lab-workloads:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    commit-message:
      prefix: "deps"
    directories:
      - /docker/ansible
      - /docker/arduino-cli
      - /docker/ci-cd-tools
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    commit-message:
      prefix: "deps"
    directories:
      - /docker/ci-cd-tools
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "terraform"
    commit-message:
      prefix: "deps"
    directories:
      - /config/terraform/**
    groups:
      dev-ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
  - package-ecosystem: "nix"
    commit-message:
      prefix: "deps"
    directories:
      - /config/nix
    # A dependency joins the first group it matches, so keep the specific
    # groups before the catch-all one.
    groups:
      dev-ci-tools:
        patterns:
          - treefmt-nix
      home-lab-platform:
        patterns:
          - "*"
    open-pull-requests-limit: 100
    schedule:
      interval: "daily"
version: 2
